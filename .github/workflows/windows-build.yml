name: Windows build

on:
  push:
    branches: [main, 'arena/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci || npm install

      - name: Unit tests
        run: npm test

      - name: Prepare runtime cache
        shell: bash
        working-directory: .
        env:
          OPENDIRECTOR_REF: 8258d4b016496d81a7c824e4cdfa42f3c840d5eb
        run: |
          bash scripts/vendor-upstream.sh
          python -m pip install --quiet uv
          mkdir -p _ffmpeg _ffbin
          curl -sSL -o _ffmpeg/ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip"
          cd _ffmpeg && unzip -q ffmpeg.zip && cd ..
          cp "$(find _ffmpeg -name ffmpeg.exe | head -1)" _ffbin/
          cp "$(find _ffmpeg -name ffprobe.exe | head -1)" _ffbin/
          export OPENDIRECTOR_FFMPEG_DIR="$PWD/_ffbin"
          node windows/scripts/prepare-runtime.mjs

      - name: Build NSIS installer
        run: npx electron-builder --win nsis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: opendirector-windows-installer
          path: |
            windows/build/*.exe
            windows/build/*.yml
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: windows-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: opendirector-windows-installer
          path: installer

      - name: Silent install smoke
        shell: pwsh
        run: |
          $exe = Get-ChildItem installer/*.exe | Select-Object -First 1
          Write-Host "Installing $($exe.Name)…"
          Start-Process -FilePath $exe.FullName -ArgumentList '/S' -Wait
          $paths = @(
            "$env:LOCALAPPDATA\Programs\OpenDirector",
            "$env:ProgramFiles\OpenDirector"
          )
          $found = $paths | Where-Object { Test-Path "$_\OpenDirector.exe" }
          if (-not $found) { throw "OpenDirector.exe not found after install" }
          Write-Host "Installed at $found"

      - name: Uninstall
        shell: pwsh
        run: |
          $uninst = Get-ChildItem "$env:LOCALAPPDATA\Programs\OpenDirector\Uninstall*.exe" -ErrorAction SilentlyContinue
          if ($uninst) {
            Start-Process -FilePath $uninst.FullName -ArgumentList '/S' -Wait
            Write-Host "Uninstalled"
          } else {
            Write-Host "No uninstaller found (per-machine layout?) — skipping"
          }
