name: Windows build

on:
  push:
    branches: [main, 'arena/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci || npm install

      - name: Unit tests
        run: npm test

      - name: Vendor upstream tree
        shell: bash
        working-directory: .
        env:
          OPENDIRECTOR_REF: 8258d4b016496d81a7c824e4cdfa42f3c840d5eb
        run: bash scripts/vendor-upstream.sh 2>&1 | tee _ci.log

      - name: Install uv
        shell: bash
        working-directory: .
        run: |
          {
            (command -v uv && uv --version) || true
            command -v uv >/dev/null 2>&1 || python -m pip install --quiet uv
            uv --version
          } 2>&1 | tee -a _ci.log

      - name: Fetch ffmpeg runtime
        shell: bash
        working-directory: .
        run: |
          {
            mkdir -p _ffmpeg _ffbin
            curl -sSL --retry 4 --retry-delay 5 --retry-all-errors -o _ffmpeg/ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip"
            ls -la _ffmpeg/
            # A truncated download must fail here, not inside Expand-Archive.
            test "$(stat -c %s _ffmpeg/ffmpeg.zip)" -gt 20000000
            powershell -c "Expand-Archive -Force -Path _ffmpeg/ffmpeg.zip -DestinationPath _ffmpeg/out"
            find _ffmpeg/out -name "ffmpeg.exe" -o -name "ffprobe.exe"
            cp "$(find _ffmpeg/out -name ffmpeg.exe | head -1)" _ffbin/
            cp "$(find _ffmpeg/out -name ffprobe.exe | head -1)" _ffbin/
          } 2>&1 | tee -a _ci.log || {
            echo "::error::fetch-ffmpeg failed; last lines of _ci.log:"
            tail -12 _ci.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Prepare runtime cache
        shell: bash
        working-directory: .
        run: |
          export OPENDIRECTOR_FFMPEG_DIR="$PWD/_ffbin"
          node windows/scripts/prepare-runtime.mjs > _prepare.log 2>&1 || {
            echo "::error::prepare-runtime failed; last lines of _prepare.log:"
            tail -12 _prepare.log | while IFS= read -r line; do echo "::error::$line"; done
            cat _prepare.log >> _ci.log
            exit 1
          }
          cat _prepare.log >> _ci.log

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: _ci.log
          if-no-files-found: ignore

      - name: Publish failure log to issue
        if: failure()
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### prepare-runtime failure (commit ${GITHUB_SHA}, run ${GITHUB_RUN_ID})"
            echo '```'
            tail -80 _prepare.log 2>/dev/null || tail -80 _ci.log 2>/dev/null || echo "(no logs)"
            echo '```'
          } > _issue-body.md
          EXISTING=$(gh issue list --search "CI diagnostics" --state open --json number -q '.[0].number // empty')
          if [ -n "$EXISTING" ]; then gh issue comment "$EXISTING" --body-file _issue-body.md; else gh issue create --title "CI diagnostics (prepare-runtime)" --body-file _issue-body.md; fi

      - name: Build NSIS installer
        run: npx electron-builder --win nsis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: opendirector-windows-installer
          path: |
            windows/build/*.exe
            windows/build/*.yml
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: windows-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: opendirector-windows-installer
          path: installer

      - name: Silent install smoke
        shell: pwsh
        run: |
          $exe = Get-ChildItem installer/*.exe | Select-Object -First 1
          Write-Host "Installing $($exe.Name)…"
          Start-Process -FilePath $exe.FullName -ArgumentList '/S' -Wait
          $paths = @(
            "$env:LOCALAPPDATA\Programs\OpenDirector",
            "$env:ProgramFiles\OpenDirector"
          )
          $found = $paths | Where-Object { Test-Path "$_\OpenDirector.exe" }
          if (-not $found) { throw "OpenDirector.exe not found after install" }
          Write-Host "Installed at $found"

      - name: Uninstall
        shell: pwsh
        run: |
          $uninst = Get-ChildItem "$env:LOCALAPPDATA\Programs\OpenDirector\Uninstall*.exe" -ErrorAction SilentlyContinue
          if ($uninst) {
            Start-Process -FilePath $uninst.FullName -ArgumentList '/S' -Wait
            Write-Host "Uninstalled"
          } else {
            Write-Host "No uninstaller found (per-machine layout?) — skipping"
          }
